name: Build APK from ZIP

"on":
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find source ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found in repository root"
            exit 1
          fi
          echo "ZIP_FILE=$ZIP_FILE" >> $GITHUB_ENV
          echo "Using source zip: $ZIP_FILE"

      - name: Unzip source
        run: |
          unzip -o "$ZIP_FILE" -d extracted
          ls -la extracted

      - name: Move source to workspace
        run: |
          shopt -s dotglob
          cp -r extracted/* .
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleScrcpyDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScrcpyForAndroid-custom-apk
          path: app/build/outputs/apk/**/*.apk
