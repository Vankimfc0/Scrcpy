name: Build SettingsFirewall APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find source ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Không tìm thấy file ZIP"
            exit 1
          fi

          echo "Found: $ZIP"
          mkdir -p source
          unzip -q "$ZIP" -d source

      - name: Find Gradle project
        run: |
          GRADLEW=$(find source -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "Không tìm thấy gradlew trong ZIP"
            find source -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleRelease --stacktrace

      - name: Find APK
        run: |
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SettingsFirewall-APK
          path: |
            source/**/build/outputs/apk/**/*.apk
            source/**/build/outputs/apk/*.apk
          if-no-files-found: error          java-version: 17

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleScrcpyDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/**/*.apk
